<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mapaencas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, body, #map {
    height: 100%;
    width: 100%;
    margin: 0;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map');

alert('Librería Leaflet cargada');

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}
).addTo(map);

fetch('./SubRM2.geojson')
.then(response => {
    console.log(response);
    return response.json();
})
.then(data => {

    alert('GeoJSON cargado');

    console.log(data);

    const capa = L.geoJSON(data, {
    style: {
        color: 'red',
        weight: 3,
        fillColor: 'yellow',
        fillOpacity: 0.7
    },

    onEachFeature: function(feature, layer) {

    let html = '';

    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' +
                feature.properties[campo] +
                '<br>';
    }

    layer.bindPopup(html);

    layer.bindTooltip(
        feature.properties.NOM_SSUBC,
        {
            permanent: true,
            direction: 'center'
        }
    );
}

}).addTo(map);

    map.fitBounds(capa.getBounds());

})
.catch(error => {

    alert("ERROR: " + error);

    console.error(error);

});


</script>

</body>
</html>
