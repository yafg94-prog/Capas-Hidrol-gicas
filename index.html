<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapaencas - Ubicación en Vivo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
        .btn-ubicacion {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid rgba(0,0,0,0.2);
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: sans-serif;
            font-size: 13px;
        }
        .btn-ubicacion:hover {
            background: #f4f4f4;
        }
    </style>
</head>
<body>

<button id="btnGPS" class="btn-ubicacion" onclick="obtenerUbicacionRobusta()">📍 Obtener Ubicación</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.min.js"></script>

<script>
const map = L.map('map').setView([-33.45, -70.66], 10);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

// Control de capas a la izquierda (debajo del zoom + / -)
const controlCapas = L.control.layers({}, {}, { 
    collapsed: false, 
    position: 'topleft' 
}).addTo(map);

const grupoGeneral = L.featureGroup();
const capasCargadas = []; 

let puntoRojoUbicacion = null;
let circuloPrecision = null;

function crearPopup(feature) {
    let html = '';
    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' + feature.properties[campo] + '<br>';
    }
    return html;
}

function crearCapa(url, color, nombre, mostrarEtiqueta = false) {
    return fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error(`No se pudo cargar "${url}" (Estado: ${response.status})`);
            }
            return response.json();
        })
        .then(data => {
            const capa = L.geoJSON(data, {
                style: {
                    color: color,
                    weight: 2,
                    fillOpacity: 0.5
                },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(crearPopup(feature));
                    if (mostrarEtiqueta && feature.properties && feature.properties.NOM_SSUBC) {
                        layer.bindTooltip(
                            feature.properties.NOM_SSUBC,
                            { permanent: true, direction: 'center' }
                        );
                    }
                }
            });

            controlCapas.addOverlay(capa, nombre);
            capa.addTo(map);
            grupoGeneral.addLayer(capa);

            capasCargadas.push({ nombre: nombre, geojson: data });
            return capa;
        });
}

// Carga de capas
Promise.all([
    crearCapa('./SubRM2.geojson', 'red', 'Subsubcuencas', true),
    crearCapa('./Juntas.geojson', 'blue', 'Juntas de Vigilancia'),
    crearCapa('./Restriccion.geojson', 'green', 'Restricciones')
])
.then(() => {
    if (grupoGeneral.getLayers().length > 0) {
        map.fitBounds(grupoGeneral.getBounds());
    }
})
.catch(error => {
    alert(error.message);
    console.error('Error al cargar capas:', error);
});

// --- LÓGICA DE GEOLOCALIZACIÓN DIRECTA ---

function obtenerUbicacionRobusta() {
    const btn = document.getElementById('btnGPS');
    btn.innerText = '⏳ Buscando GPS...';
    btn.disabled = true;

    // Primer intento con alta precisión
    map.locate({
        setView: false,
        maxZoom: 18,
        enableHighAccuracy: true,
        timeout: 7000 // 7 segundos máx para no congelar la app
    });
}

// Evento cuando se encuentra la posición exitosamente
map.on('locationfound', function(e) {
    restablecerBoton();

    const lat = e.latlng.lat;
    const lng = e.latlng.lng;
    const precisionMetros = e.accuracy;

    const latLng = [lat, lng];
    const puntoUsuario = turf.point([lng, lat]);

    let reporteMetadata = `<b>📍 Tu Posición:</b><br>`;
    reporteMetadata += `<b>Lat:</b> ${lat.toFixed(6)}, <b>Lng:</b> ${lng.toFixed(6)}<br>`;
    reporteMetadata += `<small><b>Margen de error:</b> ~${Math.round(precisionMetros)} metros</small><hr>`;

    let halladoEnAlgunaCapa = false;

    // Cruce espacial con Turf.js
    capasCargadas.forEach(item => {
        item.geojson.features.forEach(feature => {
            if (turf.booleanPointInPolygon(puntoUsuario, feature)) {
                halladoEnAlgunaCapa = true;
                reporteMetadata += `<b>Capa: ${item.nombre}</b><br>`;
                for (let propiedad in feature.properties) {
                    reporteMetadata += `• <b>${propiedad}:</b> ${feature.properties[propiedad]}<br>`;
                }
                reporteMetadata += `<br>`;
            }
        });
    });

    if (!halladoEnAlgunaCapa) {
        reporteMetadata += `<i>No te encuentras dentro de ningún polígono de las capas cargadas.</i>`;
    }

    // Limpieza de marcadores previos
    if (puntoRojoUbicacion) map.removeLayer(puntoRojoUbicacion);
    if (circuloPrecision) map.removeLayer(circuloPrecision);

    // Círculo de margen de error
    circuloPrecision = L.circle(latLng, {
        radius: precisionMetros,
        color: '#ff0000',
        fillColor: '#ff0000',
        fillOpacity: 0.15,
        stroke: false
    }).addTo(map);

    // Punto rojo de ubicación
    puntoRojoUbicacion = L.circleMarker(latLng, {
        radius: 9,
        color: '#ffffff',
        weight: 3,
        fillColor: '#ff0000',
        fillOpacity: 1.0
    })
    .addTo(map)
    .bindPopup(reporteMetadata);

    // Centrar mapa con animación
    map.flyTo(latLng, 17);
    puntoRojoUbicacion.openPopup();
});

// En caso de error o tiempo de espera agotado
map.on('locationerror', function(e) {
    restablecerBoton();
    
    // Si falla por alta precisión (Timeout), intentamos una lectura rápida por red/Wi-Fi
    console.warn("Fallo GPS de alta precisión, intentando respaldo:", e.message);
    
    map.locate({
        setView: true,
        maxZoom: 16,
        enableHighAccuracy: false,
        timeout: 5000
    });
});

function restablecerBoton() {
    const btn = document.getElementById('btnGPS');
    btn.innerText = '📍 Obtener Ubicación';
    btn.disabled = false;
}
</script>
</body>
</html>
