<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapaencas - Ubicación y Metadata</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
        .btn-ubicacion {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid rgba(0,0,0,0.2);
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: sans-serif;
            font-size: 13px;
        }
        .btn-ubicacion:hover {
            background: #f4f4f4;
        }
    </style>
</head>
<body>

<button class="btn-ubicacion" onclick="iniciarGeolocalizacionRobusta()">📍 Obtener Ubicación</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.min.js"></script>

<script>
const map = L.map('map').setView([-33.45, -70.66], 10);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

// Control de capas a la izquierda (bajo zoom)
const controlCapas = L.control.layers({}, {}, { 
    collapsed: false, 
    position: 'topleft' 
}).addTo(map);

const grupoGeneral = L.featureGroup();
const capasCargadas = []; 

let puntoRojoUbicacion = null;
let circuloPrecision = null;

function crearPopup(feature) {
    let html = '';
    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' + feature.properties[campo] + '<br>';
    }
    return html;
}

function crearCapa(url, color, nombre, mostrarEtiqueta = false) {
    return fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error(`No se pudo cargar "${url}" (Estado: ${response.status})`);
            }
            return response.json();
        })
        .then(data => {
            const capa = L.geoJSON(data, {
                style: {
                    color: color,
                    weight: 2,
                    fillOpacity: 0.5
                },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(crearPopup(feature));
                    if (mostrarEtiqueta && feature.properties && feature.properties.NOM_SSUBC) {
                        layer.bindTooltip(
                            feature.properties.NOM_SSUBC,
                            { permanent: true, direction: 'center' }
                        );
                    }
                }
            });

            controlCapas.addOverlay(capa, nombre);
            capa.addTo(map);
            grupoGeneral.addLayer(capa);

            capasCargadas.push({ nombre: nombre, geojson: data });
            return capa;
        });
}

// Carga de capas
Promise.all([
    crearCapa('./SubRM2.geojson', 'red', 'Subsubcuencas', true),
    crearCapa('./Juntas.geojson', 'blue', 'Juntas de Vigilancia'),
    crearCapa('./Restriccion.geojson', 'green', 'Restricciones')
])
.then(() => {
    if (grupoGeneral.getLayers().length > 0) {
        map.fitBounds(grupoGeneral.getBounds());
    }
})
.catch(error => {
    alert(error.message);
    console.error('Error al cargar capas:', error);
});

// --- LÓGICA DE GEOLOCALIZACIÓN CON RESPALDO (FALLBACK) Y MAYOR TIMEOUT ---

function iniciarGeolocalizacionRobusta() {
    if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
    }

    // Configuración 1: Intento primario con Alta Precisión (GPS) y Timeout extendido (20 segundos)
    const opcionesAltaPrecision = {
        enableHighAccuracy: true,
        timeout: 20000, 
        maximumAge: 0
    };

    // Configuración 2: Respaldo con Precisión Red/Celular en caso de fallo por Timeout
    const opcionesRespaldo = {
        enableHighAccuracy: false,
        timeout: 10000,
        maximumAge: 0
    };

    // Primer intento con Alta Precisión
    navigator.geolocation.getCurrentPosition(
        actualizarUbicacion,
        (error) => {
            // Si el error es por Timeout (excedió los 20 segundos buscando satélites)
            if (error.code === error.TIMEOUT) {
                console.warn("GPS de alta precisión tardó demasiado. Ejecutando respaldo...");
                navigator.geolocation.getCurrentPosition(
                    actualizarUbicacion,
                    manejarErrorGPS,
                    opcionesRespaldo
                );
            } else {
                manejarErrorGPS(error);
            }
        },
        opcionesAltaPrecision
    );
}

function actualizarUbicacion(posicion) {
    const lat = posicion.coords.latitude;
    const lng = posicion.coords.longitude;
    const precisionMetros = posicion.coords.accuracy;
    const esAltaPrecision = posicion.coords.accuracy < 50; // Criterio visual

    const latLng = [lat, lng];
    const puntoUsuario = turf.point([lng, lat]);

    let reporteMetadata = `<b>📍 Posición Detectada:</b><br>`;
    reporteMetadata += `<b>Lat:</b> ${lat.toFixed(6)}, <b>Lng:</b> ${lng.toFixed(6)}<br>`;
    reporteMetadata += `<small><b>Margen de error:</b> ~${Math.round(precisionMetros)} metros (${esAltaPrecision ? 'GPS' : 'Red/Wi-Fi'})</small><hr>`;

    let halladoEnAlgunaCapa = false;

    // Consulta espacial con Turf.js
    capasCargadas.forEach(item => {
        item.geojson.features.forEach(feature => {
            if (turf.booleanPointInPolygon(puntoUsuario, feature)) {
                halladoEnAlgunaCapa = true;
                reporteMetadata += `<b>Capa: ${item.nombre}</b><br>`;
                for (let propiedad in feature.properties) {
                    reporteMetadata += `• <b>${propiedad}:</b> ${feature.properties[propiedad]}<br>`;
                }
                reporteMetadata += `<br>`;
            }
        });
    });

    if (!halladoEnAlgunaCapa) {
        reporteMetadata += `<i>No te encuentras dentro de ningún polígono de las capas cargadas.</i>`;
    }

    // Limpiar marcadores anteriores
    if (puntoRojoUbicacion) map.removeLayer(puntoRojoUbicacion);
    if (circuloPrecision) map.removeLayer(circuloPrecision);

    // Círculo translúcido con el área de tolerancia de la lectura
    circuloPrecision = L.circle(latLng, {
        radius: precisionMetros,
        color: '#ff0000',
        fillColor: '#ff0000',
        fillOpacity: 0.15,
        stroke: false
    }).addTo(map);

    // Punto rojo en las coordenadas
    puntoRojoUbicacion = L.circleMarker(latLng, {
        radius: 9,
        color: '#ffffff',
        weight: 3,
        fillColor: '#ff0000',
        fillOpacity: 1.0
    })
    .addTo(map)
    .bindPopup(reporteMetadata);

    // Ajustar zoom y abrir ventana emergente con la metadata
    map.setView(latLng, 17);
    puntoRojoUbicacion.openPopup();
}

function manejarErrorGPS(error) {
    let mensaje = "";
    switch(error.code) {
        case error.PERMISSION_DENIED:
            mensaje = "Permiso denegado. Asegúrate de dar acceso a la ubicación en tu navegador.";
            break;
        case error.POSITION_UNAVAILABLE:
            mensaje = "Ubicación no disponible en este momento.";
            break;
        case error.TIMEOUT:
            mensaje = "Se agotó el tiempo de espera. Reintenta al aire libre o cerca de una ventana.";
            break;
        default:
            mensaje = error.message;
    }
    alert("Error de ubicación: " + mensaje);
}
</script>
</body>
</html>
