<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapaencas - GPS de Alta Precisión</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
        .btn-ubicacion {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid rgba(0,0,0,0.2);
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: sans-serif;
            font-size: 13px;
        }
        .btn-ubicacion:hover {
            background: #f4f4f4;
        }
    </style>
</head>
<body>

<button class="btn-ubicacion" onclick="iniciarSeguimientoGPS()">📍 Forzar GPS Exacto</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.min.js"></script>

<script>
const map = L.map('map').setView([-33.45, -70.66], 10);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

const controlCapas = L.control.layers({}, {}, { 
    collapsed: false, 
    position: 'topleft' 
}).addTo(map);

const grupoGeneral = L.featureGroup();
const capasCargadas = []; 

let puntoRojoUbicacion = null;
let circuloPrecision = null;
let watchId = null;

function crearPopup(feature) {
    let html = '';
    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' + feature.properties[campo] + '<br>';
    }
    return html;
}

function crearCapa(url, color, nombre, mostrarEtiqueta = false) {
    return fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error(`No se pudo cargar "${url}" (Estado: ${response.status})`);
            }
            return response.json();
        })
        .then(data => {
            const capa = L.geoJSON(data, {
                style: {
                    color: color,
                    weight: 2,
                    fillOpacity: 0.5
                },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(crearPopup(feature));
                    if (mostrarEtiqueta && feature.properties && feature.properties.NOM_SSUBC) {
                        layer.bindTooltip(
                            feature.properties.NOM_SSUBC,
                            { permanent: true, direction: 'center' }
                        );
                    }
                }
            });

            controlCapas.addOverlay(capa, nombre);
            capa.addTo(map);
            grupoGeneral.addLayer(capa);

            capasCargadas.push({ nombre: nombre, geojson: data });
            return capa;
        });
}

// Carga de capas
Promise.all([
    crearCapa('./SubRM2.geojson', 'red', 'Subsubcuencas', true),
    crearCapa('./Juntas.geojson', 'blue', 'Juntas de Vigilancia'),
    crearCapa('./Restriccion.geojson', 'green', 'Restricciones')
])
.then(() => {
    if (grupoGeneral.getLayers().length > 0) {
        map.fitBounds(grupoGeneral.getBounds());
    }
})
.catch(error => {
    alert(error.message);
    console.error('Error al cargar capas:', error);
});

// --- RASTREO CONTINUO CON ALTA PRECISIÓN (GPS DE HARDWARE) ---

function iniciarSeguimientoGPS() {
    if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
    }

    // Si ya había un rastreo activo, lo reiniciamos
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
    }

    const opcionesGPS = {
        enableHighAccuracy: true, // EXIGE el chip GPS
        timeout: 15000,            // Espera hasta 15s a la mejor señal
        maximumAge: 0              // Cero memoria caché, requiere lectura en vivo
    };

    // Usamos watchPosition en lugar de getCurrentPosition
    watchId = navigator.geolocation.watchPosition(actualizarUbicacion, manejarErrorGPS, opcionesGPS);
}

function actualizarUbicacion(posicion) {
    const lat = posicion.coords.latitude;
    const lng = posicion.coords.longitude;
    const precisionMetros = posicion.coords.accuracy;

    const latLng = [lat, lng];
    const puntoUsuario = turf.point([lng, lat]);

    let reporteMetadata = `<b>📍 Posición GPS en vivo:</b><br>`;
    reporteMetadata += `<b>Lat:</b> ${lat.toFixed(6)}, <b>Lng:</b> ${lng.toFixed(6)}<br>`;
    reporteMetadata += `<small><b>Margen de error:</b> ~${Math.round(precisionMetros)} metros</small><hr>`;

    let halladoEnAlgunaCapa = false;

    // Cruce espacial con Turf.js
    capasCargadas.forEach(item => {
        item.geojson.features.forEach(feature => {
            if (turf.booleanPointInPolygon(puntoUsuario, feature)) {
                halladoEnAlgunaCapa = true;
                reporteMetadata += `<b>Capa: ${item.nombre}</b><br>`;
                for (let propiedad in feature.properties) {
                    reporteMetadata += `• <b>${propiedad}:</b> ${feature.properties[propiedad]}<br>`;
                }
                reporteMetadata += `<br>`;
            }
        });
    });

    if (!halladoEnAlgunaCapa) {
        reporteMetadata += `<i>No te encuentras dentro de ningún polígono de las capas cargadas.</i>`;
    }

    // Dibujar o actualizar círculo de margen de error
    if (circuloPrecision) {
        circuloPrecision.setLatLng(latLng).setRadius(precisionMetros);
    } else {
        circuloPrecision = L.circle(latLng, {
            radius: precisionMetros,
            color: '#ff0000',
            fillColor: '#ff0000',
            fillOpacity: 0.15,
            stroke: false
        }).addTo(map);
    }

    // Dibujar o actualizar el PUNTO ROJO EXACTO
    if (puntoRojoUbicacion) {
        puntoRojoUbicacion.setLatLng(latLng).getPopup().setContent(reporteMetadata);
    } else {
        puntoRojoUbicacion = L.circleMarker(latLng, {
            radius: 9,
            color: '#ffffff',
            weight: 3,
            fillColor: '#ff0000',
            fillOpacity: 1.0
        })
        .addTo(map)
        .bindPopup(reporteMetadata);

        // Centrar el mapa con zoom alto en el primer punto válido encontrado
        map.setView(latLng, 18);
        puntoRojoUbicacion.openPopup();
    }
}

function manejarErrorGPS(error) {
    let mensaje = "";
    switch(error.code) {
        case error.PERMISSION_DENIED:
            mensaje = "Permiso denegado. Ve a los ajustes de tu navegador en el celular y activa 'Ubicación precisa'.";
            break;
        case error.POSITION_UNAVAILABLE:
            mensaje = "La señal de GPS no está disponible. Asegúrate de estar al aire libre.";
            break;
        case error.TIMEOUT:
            mensaje = "Se agotó el tiempo buscando satélites. Reintenta al aire libre.";
            break;
        default:
            mensaje = error.message;
    }
    alert("Error de GPS: " + mensaje);
}
</script>
</body>
</html>
