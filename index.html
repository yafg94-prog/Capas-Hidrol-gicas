<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapaencas - Ubicación Exacta y Metadata</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
        /* Botón de ubicación */
        .btn-ubicacion {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid rgba(0,0,0,0.2);
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: sans-serif;
            font-size: 13px;
        }
        .btn-ubicacion:hover {
            background: #f4f4f4;
        }
    </style>
</head>
<body>

<button class="btn-ubicacion" onclick="obtenerUbicacionExacta()">📍 Mi Ubicación Exacta</button>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Turf.js para análisis espacial -->
<script src="https://unpkg.com/@turf/turf@6/turf.min.min.js"></script>

<script>
const map = L.map('map').setView([-33.45, -70.66], 10);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

// Control de capas a la izquierda (bajo zoom)
const controlCapas = L.control.layers({}, {}, { 
    collapsed: false, 
    position: 'topleft' 
}).addTo(map);

const grupoGeneral = L.featureGroup();
const capasCargadas = []; 

// Variables para los marcadores de precisión roja y área de tolerancia
let puntoRojoUbicacion = null;
let circuloPrecision = null;

function crearPopup(feature) {
    let html = '';
    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' + feature.properties[campo] + '<br>';
    }
    return html;
}

function crearCapa(url, color, nombre, mostrarEtiqueta = false) {
    return fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error(`No se pudo cargar "${url}" (Estado: ${response.status})`);
            }
            return response.json();
        })
        .then(data => {
            const capa = L.geoJSON(data, {
                style: {
                    color: color,
                    weight: 2,
                    fillOpacity: 0.5
                },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(crearPopup(feature));
                    if (mostrarEtiqueta && feature.properties && feature.properties.NOM_SSUBC) {
                        layer.bindTooltip(
                            feature.properties.NOM_SSUBC,
                            { permanent: true, direction: 'center' }
                        );
                    }
                }
            });

            controlCapas.addOverlay(capa, nombre);
            capa.addTo(map);
            grupoGeneral.addLayer(capa);

            capasCargadas.push({ nombre: nombre, geojson: data });
            return capa;
        });
}

// Carga de capas
Promise.all([
    crearCapa('./SubRM2.geojson', 'red', 'Subsubcuencas', true),
    crearCapa('./Juntas.geojson', 'blue', 'Juntas de Vigilancia'),
    crearCapa('./Restriccion.geojson', 'green', 'Restricciones')
])
.then(() => {
    if (grupoGeneral.getLayers().length > 0) {
        map.fitBounds(grupoGeneral.getBounds());
    }
})
.catch(error => {
    alert(error.message);
    console.error('Error al cargar capas:', error);
});

// --- GEOLOCALIZACIÓN DE ALTA PRECISIÓN ---

function obtenerUbicacionExacta() {
    if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
    }

    // Configuración para forzar GPS de alta precisión en teléfonos móviles
    map.locate({
        setView: true,
        maxZoom: 18,               // Zoom cercano para ver el detalle exacto
        enableHighAccuracy: true,  // Forzar uso de GPS de hardware
        timeout: 10000,            // Esperar hasta 10 segundos para fijar satélites
        maximumAge: 0              // No usar lecturas guardadas en caché
    });
}

map.on('locationfound', function(e) {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;
    const precisionMetros = e.accuracy; // Margen de error en metros entregado por el GPS

    const puntoUsuario = turf.point([lng, lat]);

    let reporteMetadata = `<b>📍 Tu posición exacta:</b><br>`;
    reporteMetadata += `<b>Lat:</b> ${lat.toFixed(6)}, <b>Lng:</b> ${lng.toFixed(6)}<br>`;
    reporteMetadata += `<small><b>Precisión GPS:</b> ~${Math.round(precisionMetros)} metros</small><hr>`;

    let halladoEnAlgunaCapa = false;

    // Cruce espacial con Turf.js
    capasCargadas.forEach(item => {
        item.geojson.features.forEach(feature => {
            if (turf.booleanPointInPolygon(puntoUsuario, feature)) {
                halladoEnAlgunaCapa = true;
                reporteMetadata += `<b>Capa: ${item.nombre}</b><br>`;
                for (let propiedad in feature.properties) {
                    reporteMetadata += `• <b>${propiedad}:</b> ${feature.properties[propiedad]}<br>`;
                }
                reporteMetadata += `<br>`;
            }
        });
    });

    if (!halladoEnAlgunaCapa) {
        reporteMetadata += `<i>No te encuentras dentro de ningún polígono de las capas cargadas.</i>`;
    }

    // Limpiar marcadores anteriores si ya existían
    if (puntoRojoUbicacion) map.removeLayer(puntoRojoUbicacion);
    if (circuloPrecision) map.removeLayer(circuloPrecision);

    // 1. Círculo suave que muestra el radio de tolerancia del GPS
    circuloPrecision = L.circle(e.latlng, {
        radius: precisionMetros,
        color: '#ff0000',
        fillColor: '#ff0000',
        fillOpacity: 0.15,
        stroke: false
    }).addTo(map);

    // 2. Punto Rojo Preciso e Intenso
    puntoRojoUbicacion = L.circleMarker(e.latlng, {
        radius: 8,              // Tamaño del punto rojo
        color: '#ffffff',       // Borde blanco para resaltar
        weight: 2,
        fillColor: '#ff0000',   // Rojo puro
        fillOpacity: 1.0
    })
    .addTo(map)
    .bindPopup(reporteMetadata)
    .openPopup();
});

map.on('locationerror', function(e) {
    alert("No se pudo obtener la ubicación exacta: " + e.message + "\n\nAsegúrate de tener activado el GPS/Ubicación en los ajustes de tu teléfono.");
});
</script>
</body>
</html>
