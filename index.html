<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapaencas - GPS Satelital</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
        .btn-ubicacion {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid rgba(0,0,0,0.2);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .btn-ubicacion:disabled {
            background: #fff3cd;
            color: #856404;
            border-color: #ffeeba;
            cursor: wait;
        }
        /* Estilo para el pin rojo personalizado */
        .pin-marcador {
            background: none;
            border: none;
        }
    </style>
</head>
<body>

<button id="btnGPS" class="btn-ubicacion" onclick="iniciarBusquedaGPS()">📍 Obtener Ubicación Exacta</button>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Turf.js para cruce espacial (URL corregida) -->
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>
const map = L.map('map').setView([-33.45, -70.66], 10);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

// Control de capas a la izquierda
const controlCapas = L.control.layers({}, {}, { 
    collapsed: false, 
    position: 'topleft' 
}).addTo(map);

const grupoGeneral = L.featureGroup();
const capasCargadas = []; 

let puntoUbicacion = null;   // marcador tipo pin
let circuloPrecision = null;
let watcherID = null;        // ID del watchPosition

// Icono tipo "pin" rojo
const pinIcon = L.divIcon({
    className: 'pin-marcador',
    html: '<svg width="32" height="44" viewBox="0 0 32 44" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M16 0C7.164 0 0 7.164 0 16c0 12 16 28 16 28s16-16 16-28C32 7.164 24.836 0 16 0z" fill="#e63946" stroke="#fff" stroke-width="2.5"/>' +
          '<circle cx="16" cy="16" r="6" fill="#fff"/>' +
          '</svg>',
    iconSize: [32, 44],
    iconAnchor: [16, 44],   // punta del pin abajo
    popupAnchor: [0, -44]
});

function crearPopup(feature) {
    let html = '';
    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' + feature.properties[campo] + '<br>';
    }
    return html;
}

function crearCapa(url, color, nombre, mostrarEtiqueta = false) {
    return fetch(url)
        .then(response => {
            if (!response.ok) throw new Error(`No se pudo cargar "${url}" (Estado: ${response.status})`);
            return response.json();
        })
        .then(data => {
            const capa = L.geoJSON(data, {
                style: {
                    color: color,
                    weight: 2,
                    fillOpacity: 0.5
                },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(crearPopup(feature));
                    if (mostrarEtiqueta && feature.properties && feature.properties.NOM_SSUBC) {
                        layer.bindTooltip(feature.properties.NOM_SSUBC, {
                            permanent: true, direction: 'center'
                        });
                    }
                }
            });

            controlCapas.addOverlay(capa, nombre);
            capa.addTo(map);
            grupoGeneral.addLayer(capa);
            capasCargadas.push({ nombre: nombre, geojson: data });
            return capa;
        });
}

// Carga de capas (tus archivos GeoJSON)
Promise.all([
    crearCapa('./SubRM2.geojson', 'red', 'Subsubcuencas', true),
    crearCapa('./Juntas.geojson', 'blue', 'Juntas de Vigilancia'),
    crearCapa('./Restriccion.geojson', 'green', 'Restricciones')
])
.then(() => {
    if (grupoGeneral.getLayers().length > 0) {
        map.fitBounds(grupoGeneral.getBounds());
    }
})
.catch(error => {
    alert("Error cargando mapas: " + error.message);
});

// ------------- LÓGICA DE GEOLOCALIZACIÓN MEJORADA -------------

function iniciarBusquedaGPS() {
    const btn = document.getElementById('btnGPS');
    
    if (!navigator.geolocation) {
        alert("Tu navegador no admite geolocalización.");
        return;
    }

    // Detener cualquier watcher previo
    if (watcherID !== null) {
        navigator.geolocation.clearWatch(watcherID);
        watcherID = null;
    }

    btn.innerText = '⏳ Buscando satélites...';
    btn.disabled = true;

    const opcionesGPS = {
        enableHighAccuracy: true,
        timeout: 20000,        // 20 segundos máximo para la primera lectura
        maximumAge: 0          // Forzar lectura fresca
    };

    // Intentar una primera lectura rápida
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            // Ya tenemos una primera posición, la mostramos y luego afinamos con watch
            actualizarMarcador(pos);
            // Iniciar watcher para mejorar precisión si es necesario
            iniciarWatcher();
        },
        (err) => {
            // Si falla el primer intento, mostramos error y damos opción de reintentar
            restablecerBoton();
            manejarErrorUbicacion(err);
        },
        opcionesGPS
    );
}

function iniciarWatcher() {
    // Si ya teníamos un watcher, lo detenemos
    if (watcherID !== null) {
        navigator.geolocation.clearWatch(watcherID);
    }

    let intentos = 0;
    const maxIntentos = 60;   // ~30 segundos (cada callback ~500ms)
    const precisionDeseada = 10; // metros

    watcherID = navigator.geolocation.watchPosition(
        (pos) => {
            intentos++;
            const precision = pos.coords.accuracy;
            actualizarMarcador(pos);

            // Si alcanzamos la precisión deseada o se agotaron intentos, paramos
            if (precision <= precisionDeseada || intentos >= maxIntentos) {
                navigator.geolocation.clearWatch(watcherID);
                watcherID = null;
                restablecerBoton();
                // Abrir popup automáticamente
                if (puntoUbicacion) {
                    setTimeout(() => puntoUbicacion.openPopup(), 800);
                }
            }
        },
        (err) => {
            // Error durante el watcher; no detenemos el botón, pero informamos
            console.warn('Error en watchPosition:', err.message);
            // Si falla irremediablemente, limpiamos
            if (err.code === err.TIMEOUT || err.code === err.POSITION_UNAVAILABLE) {
                navigator.geolocation.clearWatch(watcherID);
                watcherID = null;
                restablecerBoton();
                alert('No se pudo mantener la señal GPS. Intenta de nuevo en un lugar abierto.');
            }
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

function actualizarMarcador(posicion) {
    const lat = posicion.coords.latitude;
    const lng = posicion.coords.longitude;
    const precisionMetros = posicion.coords.accuracy;
    const latLng = [lat, lng];

    // Limpiar marcadores anteriores
    if (puntoUbicacion) map.removeLayer(puntoUbicacion);
    if (circuloPrecision) map.removeLayer(circuloPrecision);

    // Círculo del margen de error
    circuloPrecision = L.circle(latLng, {
        radius: precisionMetros,
        color: '#e63946',
        fillColor: '#e63946',
        fillOpacity: 0.15,
        stroke: false
    }).addTo(map);

    // Punto tipo PIN rojo
    puntoUbicacion = L.marker(latLng, { icon: pinIcon }).addTo(map);

    // Construir popup con información espacial
    const puntoTurf = turf.point([lng, lat]);
    let contenidoPopup = `<b>📍 Tu ubicación</b><br>
                          Lat: ${lat.toFixed(6)} Lng: ${lng.toFixed(6)}<br>
                          Precisión: ~${Math.round(precisionMetros)} m<hr>`;

    let encontrado = false;
    capasCargadas.forEach(item => {
        item.geojson.features.forEach(feature => {
            if (turf.booleanPointInPolygon(puntoTurf, feature)) {
                encontrado = true;
                contenidoPopup += `<b>Capa: ${item.nombre}</b><br>`;
                for (let prop in feature.properties) {
                    contenidoPopup += `• <b>${prop}:</b> ${feature.properties[prop]}<br>`;
                }
                contenidoPopup += `<br>`;
            }
        });
    });

    if (!encontrado) {
        contenidoPopup += '<i>No estás dentro de ningún polígono cargado.</i>';
    }

    puntoUbicacion.bindPopup(contenidoPopup);

    // Encuadre suave (solo en la primera actualización o cuando el usuario no esté interactuando)
    if (!map._isMoving) {
        map.flyTo(latLng, 18, { animate: true, duration: 1.2 });
    }
}

function manejarErrorUbicacion(error) {
    let mensaje = '';
    switch(error.code) {
        case error.PERMISSION_DENIED:
            mensaje = 'Permiso de ubicación denegado. Por favor actívalo en la configuración del navegador.';
            break;
        case error.POSITION_UNAVAILABLE:
            mensaje = 'Señal GPS no disponible. Intenta en un lugar con vista al cielo.';
            break;
        case error.TIMEOUT:
            mensaje = 'El GPS tardó demasiado. ¿Estás en interiores?';
            break;
        default:
            mensaje = error.message;
    }
    alert('Error de geolocalización: ' + mensaje);
}

function restablecerBoton() {
    const btn = document.getElementById('btnGPS');
    btn.innerText = '📍 Obtener Ubicación Exacta';
    btn.disabled = false;
}
</script>
</body>
</html>
