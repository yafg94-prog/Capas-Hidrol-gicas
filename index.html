<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mapaencas</title>

<link rel="stylesheet" href=".4/dist/leaflet.css>

<style>
html, body, #map {
    height: 100%;
    width: 100%;
    margin: 0;
}
</style>

</head>

<body>

<div id="map"></div>

<https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>

const map = L.map('map');

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}
).addTo(map);

fetch('./Subcuencas Json.geojson')
.then(response => response.json())
.then(data => {

    const capa = L.geoJSON(data,{
        style:{
            color:'#0046ad',
            weight:1,
            fillColor:'#55aaff',
            fillOpacity:0.4
        }
    }).addTo(map);

    map.fitBounds(capa.getBounds());

})
.catch(error => console.error(error));

</script>

</body>
</html>
