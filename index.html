<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapaencas - GPS Satelital + Buffer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        /* Barra superior con degradado y textura */
        #barra-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5vh;
            min-height: 36px;
            background: linear-gradient(135deg, #1a3c2e 0%, #2d5a3f 100%);
            background-image: 
                linear-gradient(135deg, #1a3c2e 0%, #2d5a3f 100%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M0 0h100v100H0z" fill="none"/><path d="M10 10h80v80H10z" fill="rgba(255,255,255,0.03)"/></svg>');
            background-blend-mode: overlay;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-family: sans-serif;
            font-size: clamp(14px, 2.5vh, 20px);
            font-weight: bold;
            letter-spacing: 0.5px;
            z-index: 2000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        #barra-superior .titulo {
            display: flex;
            align-items: center;
        }
        #barra-superior .globo {
            width: clamp(24px, 4vh, 40px);
            height: clamp(24px, 4vh, 40px);
            margin-left: 10px;
            flex-shrink: 0;
        }
        #map {
            position: absolute;
            top: 5vh;
            bottom: 0;
            width: 100%;
        }
        .btn-ubicacion, .btn-buffer {
            position: absolute;
            z-index: 1500;
            background: #ffffff;
            border: 2px solid rgba(0,0,0,0.2);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .btn-ubicacion {
            top: calc(5vh + 15px);
            right: 15px;
        }
        .btn-buffer {
            top: calc(5vh + 70px);
            right: 15px;
        }
        .btn-ubicacion:disabled, .btn-buffer:disabled {
            background: #fff3cd;
            color: #856404;
            border-color: #ffeeba;
            cursor: not-allowed;
        }
        .pin-marcador {
            background: none;
            border: none;
        }
        /* Icono gota de agua para puntos de Juntas */
        .icono-gota {
            background: none;
            border: none;
        }
        @media (max-width: 768px) {
            .btn-ubicacion, .btn-buffer {
                font-size: 16px;
                padding: 12px 20px;
                border-radius: 8px;
            }
            .btn-ubicacion {
                top: calc(5vh + 15px);
                right: 10px;
            }
            .btn-buffer {
                top: calc(5vh + 80px);
                right: 10px;
            }
        }
    </style>
</head>
<body>

<div id="barra-superior">
    <span class="titulo">Sistema georeferencia Chile</span>
    <!-- Globo terráqueo con Chile destacado -->
    <svg class="globo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Círculo base (mundo) -->
        <circle cx="50" cy="50" r="48" fill="#1e90ff" stroke="white" stroke-width="2"/>
        <!-- Continente simplificado (América del Sur) -->
        <path d="M40,30 L55,28 L60,40 L58,55 L45,70 L38,65 L32,50 Z" fill="#228b22" stroke="white" stroke-width="0.5"/>
        <!-- Chile resaltado (franja alargada) -->
        <path d="M38,35 L44,34 L46,45 L44,60 L42,70 L38,65 Z" fill="#FFD700" stroke="#b8860b" stroke-width="0.8"/>
        <!-- Líneas de longitud/latitud -->
        <ellipse cx="50" cy="50" rx="48" ry="20" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
        <line x1="50" y1="2" x2="50" y2="98" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
    </svg>
</div>

<button id="btnGPS" class="btn-ubicacion" onclick="iniciarBusquedaGPS()">📍 Obtener Ubicación Exacta</button>
<button id="btnBuffer" class="btn-buffer" onclick="analizarBuffer()" disabled title="Primero obtén tu ubicación GPS">🔵 Buffer y Análisis</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>
const map = L.map('map').setView([-33.45, -70.66], 10);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

// Control de capas con iconos de tipo (se añadirán al crear cada capa)
const controlCapas = L.control.layers({}, {}, { collapsed: false, position: 'topleft' }).addTo(map);
const grupoGeneral = L.featureGroup();
const capasCargadas = []; 

let puntoUbicacion = null;
let circuloPrecision = null;
let watcherID = null;
let bufferCircle = null;
let bufferPopupMarker = null;

// Icono pin rojo para ubicación GPS
const pinIcon = L.divIcon({
    className: 'pin-marcador',
    html: '<svg width="32" height="44" viewBox="0 0 32 44" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M16 0C7.164 0 0 7.164 0 16c0 12 16 28 16 28s16-16 16-28C32 7.164 24.836 0 16 0z" fill="#e63946" stroke="#fff" stroke-width="2.5"/>' +
          '<circle cx="16" cy="16" r="6" fill="#fff"/>' +
          '</svg>',
    iconSize: [32, 44],
    iconAnchor: [16, 44],
    popupAnchor: [0, -44]
});

// Icono gota de agua para puntos de Juntas de Vigilancia
const iconoGotaAgua = L.divIcon({
    className: 'icono-gota',
    html: '<svg width="24" height="30" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M12 0C5.373 0 0 5.373 0 12c0 6.627 12 18 12 18s12-11.373 12-18C24 5.373 18.627 0 12 0z" fill="#1e90ff" stroke="#fff" stroke-width="1.5"/>' +
          '<circle cx="12" cy="12" r="4" fill="#fff" opacity="0.8"/>' +
          '</svg>',
    iconSize: [24, 30],
    iconAnchor: [12, 30],
    popupAnchor: [0, -30]
});

// ---------- FUNCIÓN AUXILIAR PARA ANÁLISIS ESPACIAL SEGURO ----------
function analizarRelacionEspacial(puntoUsuario, feature) {
    try {
        const tipo = feature.geometry.type;
        
        if (tipo === 'Polygon' || tipo === 'MultiPolygon') {
            return {
                tipo: 'poligono',
                dentro: turf.booleanPointInPolygon(puntoUsuario, feature),
                distancia: null
            };
        } else if (tipo === 'LineString' || tipo === 'MultiLineString') {
            const distancia = turf.pointToLineDistance(puntoUsuario, feature, { units: 'meters' });
            return {
                tipo: 'linea',
                dentro: false,
                distancia: distancia
            };
        } else if (tipo === 'Point') {
            const distancia = turf.distance(puntoUsuario, feature, { units: 'meters' });
            return {
                tipo: 'punto',
                dentro: false,
                distancia: distancia
            };
        } else {
            return { tipo: 'desconocido', dentro: false, distancia: null };
        }
    } catch (error) {
        console.warn(`Error analizando geometría tipo ${feature.geometry.type}:`, error.message);
        return { tipo: 'error', dentro: false, distancia: null };
    }
}

// ---------- CARGA DE CAPAS MEJORADA (con iconos de tipo y personalización de puntos) ----------
function crearPopup(feature) {
    let html = '';
    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' + feature.properties[campo] + '<br>';
    }
    return html;
}

// Íconos Unicode para el control de capas
const iconoTipo = {
    poligono: '■',
    linea: '━',
    punto: '●'
};

function crearCapa(url, color, nombre, tipoGeometria, mostrarEtiqueta = false) {
    return fetch(url)
        .then(response => {
            if (!response.ok) throw new Error(`No se pudo cargar "${url}" (Estado: ${response.status})`);
            return response.json();
        })
        .then(data => {
            const opcionesCapa = {
                style: { color: color, weight: 2, fillOpacity: 0.5 },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(crearPopup(feature));
                    if (mostrarEtiqueta && feature.properties && feature.properties.NOM_SSUBC) {
                        layer.bindTooltip(feature.properties.NOM_SSUBC, { permanent: true, direction: 'center' });
                    }
                }
            };

            // Si la capa es de puntos, usar icono personalizado (gota de agua azul)
            if (tipoGeometria === 'punto') {
                opcionesCapa.pointToLayer = function (feature, latlng) {
                    return L.marker(latlng, { icon: iconoGotaAgua });
                };
            }

            const capa = L.geoJSON(data, opcionesCapa);

            // Nombre con icono de tipo en el control de capas
            const nombreConIcono = `<span style="color:${color}; font-size:1.2em;">${iconoTipo[tipoGeometria] || '●'}</span> ${nombre}`;
            controlCapas.addOverlay(capa, nombreConIcono);
            capa.addTo(map);
            grupoGeneral.addLayer(capa);
            capasCargadas.push({ nombre: nombre, geojson: data });
            return capa;
        });
}

// Carga de todas las capas (se asigna tipo de geometría predominante para el icono)
Promise.all([
    crearCapa('./SubRM2.geojson', 'red', 'Subsubcuencas', 'poligono', false),
    crearCapa('./Juntas.geojson', 'blue', 'Juntas de Vigilancia', 'punto'), // ahora con gota azul
    crearCapa('./Restriccion.geojson', 'green', 'Restricciones', 'poligono'),
    crearCapa('./Redhidro.geojson', '#00bcd4', 'Red Hidrográfica', 'linea')
])
.then(() => {
    if (grupoGeneral.getLayers().length > 0) {
        map.fitBounds(grupoGeneral.getBounds());
    }
})
.catch(error => alert("Error cargando mapas: " + error.message));

// ---------- GPS CORREGIDO CON VUELO ASEGURADO (sin cambios) ----------
// ... (se mantiene todo el código de GPS, buffer y análisis exactamente igual al último proporcionado por el usuario) ...

function iniciarBusquedaGPS() {
    const btnGPS = document.getElementById('btnGPS');
    const btnBuffer = document.getElementById('btnBuffer');
    if (!navigator.geolocation) {
        alert("Tu navegador no admite geolocalización.");
        return;
    }
    if (watcherID !== null) {
        navigator.geolocation.clearWatch(watcherID);
        watcherID = null;
    }
    btnGPS.innerText = '⏳ Buscando satélites...';
    btnGPS.disabled = true;
    btnBuffer.disabled = true;
    btnBuffer.title = 'Primero obtén tu ubicación GPS';

    const opcionesGPS = { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 };
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            actualizarMarcador(pos);
            map.flyTo([pos.coords.latitude, pos.coords.longitude], 18, { animate: true, duration: 1.5 });
            iniciarWatcher();
        },
        (err) => {
            restablecerBotonGPS();
            manejarErrorUbicacion(err);
        },
        opcionesGPS
    );
}

function iniciarWatcher() {
    if (watcherID !== null) navigator.geolocation.clearWatch(watcherID);
    let intentos = 0;
    const maxIntentos = 60;
    const precisionDeseada = 10;
    watcherID = navigator.geolocation.watchPosition(
        (pos) => {
            intentos++;
            actualizarMarcador(pos, false);
            if (pos.coords.accuracy <= precisionDeseada || intentos >= maxIntentos) {
                navigator.geolocation.clearWatch(watcherID);
                watcherID = null;
                restablecerBotonGPS();
                const btnBuffer = document.getElementById('btnBuffer');
                btnBuffer.disabled = false;
                btnBuffer.title = '';
                if (puntoUbicacion) setTimeout(() => puntoUbicacion.openPopup(), 800);
            }
        },
        (err) => {
            console.warn('Error en watchPosition:', err.message);
            if (err.code === err.TIMEOUT || err.code === err.POSITION_UNAVAILABLE) {
                navigator.geolocation.clearWatch(watcherID);
                watcherID = null;
                restablecerBotonGPS();
                alert('No se pudo mantener la señal GPS. Intenta en un lugar abierto.');
            }
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
}

function actualizarMarcador(posicion, volar = false) {
    const lat = posicion.coords.latitude;
    const lng = posicion.coords.longitude;
    const precisionMetros = posicion.coords.accuracy;
    const latLng = [lat, lng];

    if (puntoUbicacion) map.removeLayer(puntoUbicacion);
    if (circuloPrecision) map.removeLayer(circuloPrecision);

    circuloPrecision = L.circle(latLng, {
        radius: precisionMetros,
        color: '#e63946',
        fillColor: '#e63946',
        fillOpacity: 0.15,
        stroke: false
    }).addTo(map);

    puntoUbicacion = L.marker(latLng, { icon: pinIcon }).addTo(map);

    const puntoTurf = turf.point([lng, lat]);
    let contenidoPopup = `<b>📍 Tu ubicación</b><br>
                          <b>Lat:</b> ${lat.toFixed(6)} <b>Lng:</b> ${lng.toFixed(6)}<br>
                          <b>Precisión:</b> ~${Math.round(precisionMetros)} m<hr>`;
    let encontradoAlgo = false;

    capasCargadas.forEach(item => {
        let capaInfo = '';
        let contadorFeatures = 0;
        item.geojson.features.forEach(feature => {
            const resultado = analizarRelacionEspacial(puntoTurf, feature);
            if (resultado.tipo === 'poligono' && resultado.dentro) {
                if (contadorFeatures === 0) capaInfo += `<b>📁 ${item.nombre}</b><br>`;
                capaInfo += `<div style="margin-left:15px; font-size:12px;">✅ Dentro del polígono<br>`;
                for (let prop in feature.properties) capaInfo += `• <b>${prop}:</b> ${feature.properties[prop]}<br>`;
                capaInfo += `</div>`;
                contadorFeatures++;
                encontradoAlgo = true;
            } else if (resultado.tipo === 'linea' && resultado.distancia < 1000) {
                if (contadorFeatures === 0) capaInfo += `<b>📁 ${item.nombre}</b><br>`;
                capaInfo += `<div style="margin-left:15px; font-size:12px;">📏 Línea a ${Math.round(resultado.distancia)} m<br>`;
                for (let prop in feature.properties) capaInfo += `• <b>${prop}:</b> ${feature.properties[prop]}<br>`;
                capaInfo += `</div>`;
                contadorFeatures++;
                encontradoAlgo = true;
            } else if (resultado.tipo === 'punto' && resultado.distancia < 1000) {
                if (contadorFeatures === 0) capaInfo += `<b>📁 ${item.nombre}</b><br>`;
                capaInfo += `<div style="margin-left:15px; font-size:12px;">📍 Punto a ${Math.round(resultado.distancia)} m<br>`;
                for (let prop in feature.properties) capaInfo += `• <b>${prop}:</b> ${feature.properties[prop]}<br>`;
                capaInfo += `</div>`;
                contadorFeatures++;
                encontradoAlgo = true;
            }
        });
        if (capaInfo) contenidoPopup += capaInfo + '<br>';
    });

    if (!encontradoAlgo) contenidoPopup += '<i>No se encontraron elementos cercanos en las capas cargadas.</i>';
    puntoUbicacion.bindPopup(contenidoPopup, { maxWidth: 350, maxHeight: 400 });
    if (volar) map.flyTo(latLng, 18, { animate: true, duration: 1.2 });
}

function manejarErrorUbicacion(error) {
    let mensaje = '';
    switch(error.code) {
        case error.PERMISSION_DENIED: mensaje = 'Permiso de ubicación denegado.'; break;
        case error.POSITION_UNAVAILABLE: mensaje = 'Señal GPS no disponible.'; break;
        case error.TIMEOUT: mensaje = 'El GPS tardó demasiado.'; break;
        default: mensaje = error.message;
    }
    alert('Error de geolocalización: ' + mensaje);
}

function restablecerBotonGPS() {
    const btn = document.getElementById('btnGPS');
    btn.innerText = '📍 Obtener Ubicación Exacta';
    btn.disabled = false;
}

// ---------- BUFFER Y ANÁLISIS (sin cambios) ----------
function analizarBuffer() {
    const btnBuffer = document.getElementById('btnBuffer');
    if (btnBuffer.disabled) { alert('Primero debes obtener tu ubicación GPS.'); return; }
    if (!puntoUbicacion) { alert('No hay una ubicación GPS fijada.'); return; }

    btnBuffer.disabled = true;
    btnBuffer.innerText = '⏳ Analizando...';

    try {
        const latLng = puntoUbicacion.getLatLng();
        const lat = latLng.lat;
        const lng = latLng.lng;
        const puntoCentral = turf.point([lng, lat]);

        const metros = prompt('Ingresa el radio del buffer en metros (ej: 200):', '200');
        if (!metros || isNaN(metros) || metros <= 0) {
            alert('Valor inválido.');
            restablecerBotonBuffer();
            return;
        }
        const radio = parseFloat(metros);

        let bufferPolygon;
        try {
            bufferPolygon = turf.buffer(puntoCentral, radio, { units: 'meters' });
        } catch (e) {
            alert('Error al crear buffer: ' + e.message);
            restablecerBotonBuffer();
            return;
        }

        if (bufferCircle) map.removeLayer(bufferCircle);
        bufferCircle = L.circle([lat, lng], {
            radius: radio,
            color: '#1f77b4',
            fillColor: '#1f77b4',
            fillOpacity: 0.1,
            weight: 2,
            dashArray: '5, 5'
        }).addTo(map);

        let resultadoHTML = `<b>🔵 Buffer de ${radio} m</b><br><small>Centro: ${lat.toFixed(6)}, ${lng.toFixed(6)}</small><hr>`;
        let totalFeaturesEnBuffer = 0;
        const capasResultados = [];

        capasCargadas.forEach(item => {
            const featuresIntersect = [];
            item.geojson.features.forEach(feature => {
                try {
                    if (turf.booleanIntersects(bufferPolygon, feature)) {
                        let distancia = null;
                        if (feature.geometry.type === 'Point') {
                            distancia = turf.distance(puntoCentral, feature, { units: 'meters' });
                        } else if (feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString') {
                            distancia = turf.pointToLineDistance(puntoCentral, feature, { units: 'meters' });
                        }
                        featuresIntersect.push({ feature, distancia });
                    }
                } catch (error) {
                    console.warn('Error analizando feature en buffer:', error.message);
                }
            });

            if (featuresIntersect.length > 0) {
                capasResultados.push({
                    nombre: item.nombre,
                    cantidad: featuresIntersect.length,
                    elementos: featuresIntersect
                });
                totalFeaturesEnBuffer += featuresIntersect.length;
            }
        });

        if (capasResultados.length === 0) {
            resultadoHTML += '<i>No se encontraron elementos dentro del buffer.</i>';
        } else {
            capasResultados.forEach(capaRes => {
                resultadoHTML += `<b>📁 ${capaRes.nombre} (${capaRes.cantidad} elementos)</b><br>`;
                capaRes.elementos.forEach((elem, idx) => {
                    const props = elem.feature.properties;
                    resultadoHTML += `<div style="margin-left:15px; font-size:12px;">`;
                    if (elem.distancia !== null) resultadoHTML += `🔹 Distancia: ${Math.round(elem.distancia)} m<br>`;
                    for (let prop in props) resultadoHTML += `• <b>${prop}:</b> ${props[prop]}<br>`;
                    resultadoHTML += `</div>`;
                    if (idx < capaRes.elementos.length - 1) resultadoHTML += '<br>';
                });
                resultadoHTML += '<br>';
            });
            resultadoHTML += `<b>✅ Total de elementos: ${totalFeaturesEnBuffer}</b>`;
        }

        if (bufferPopupMarker) map.removeLayer(bufferPopupMarker);
        bufferPopupMarker = L.marker([lat, lng], {
            icon: L.divIcon({ className: 'pin-marcador', html: '', iconSize: [0,0] })
        }).addTo(map);
        bufferPopupMarker.bindPopup(resultadoHTML, { maxWidth: 400, maxHeight: 500 });
        bufferPopupMarker.openPopup();

        map.fitBounds(bufferCircle.getBounds(), { padding: [50, 50] });

    } catch (error) {
        console.error('Error en análisis de buffer:', error);
        alert('Ocurrió un error: ' + error.message);
    } finally {
        restablecerBotonBuffer();
    }
}

function restablecerBotonBuffer() {
    const btn = document.getElementById('btnBuffer');
    btn.innerText = '🔵 Buffer y Análisis';
    btn.disabled = false;
    btn.title = '';
}
</script>
</body>
</html>
