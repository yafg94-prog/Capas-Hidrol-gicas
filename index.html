<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapaencas - GPS Satelital</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
        .btn-ubicacion {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid rgba(0,0,0,0.2);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .btn-ubicacion:disabled {
            background: #fff3cd;
            color: #856404;
            border-color: #ffeeba;
            cursor: wait;
        }
    </style>
</head>
<body>

<button id="btnGPS" class="btn-ubicacion" onclick="obtenerUbicacionNativa()">📍 Obtener Ubicación Exacta</button>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Turf.js para cruce espacial -->
<script src="https://unpkg.com/@turf/turf@6/turf.min.min.js"></script>

<script>
const map = L.map('map').setView([-33.45, -70.66], 10);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

// Control de capas a la izquierda (bajo los botones + y -)
const controlCapas = L.control.layers({}, {}, { 
    collapsed: false, 
    position: 'topleft' 
}).addTo(map);

const grupoGeneral = L.featureGroup();
const capasCargadas = []; 

let puntoRojoUbicacion = null;
let circuloPrecision = null;

function crearPopup(feature) {
    let html = '';
    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' + feature.properties[campo] + '<br>';
    }
    return html;
}

function crearCapa(url, color, nombre, mostrarEtiqueta = false) {
    return fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error(`No se pudo cargar "${url}" (Estado: ${response.status})`);
            }
            return response.json();
        })
        .then(data => {
            const capa = L.geoJSON(data, {
                style: {
                    color: color,
                    weight: 2,
                    fillOpacity: 0.5
                },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(crearPopup(feature));
                    if (mostrarEtiqueta && feature.properties && feature.properties.NOM_SSUBC) {
                        layer.bindTooltip(
                            feature.properties.NOM_SSUBC,
                            { permanent: true, direction: 'center' }
                        );
                    }
                }
            });

            controlCapas.addOverlay(capa, nombre);
            capa.addTo(map);
            grupoGeneral.addLayer(capa);

            capasCargadas.push({ nombre: nombre, geojson: data });
            return capa;
        });
}

// Carga de capas
Promise.all([
    crearCapa('./SubRM2.geojson', 'red', 'Subsubcuencas', true),
    crearCapa('./Juntas.geojson', 'blue', 'Juntas de Vigilancia'),
    crearCapa('./Restriccion.geojson', 'green', 'Restricciones')
])
.then(() => {
    if (grupoGeneral.getLayers().length > 0) {
        map.fitBounds(grupoGeneral.getBounds());
    }
})
.catch(error => {
    alert("Error cargando mapas: " + error.message);
});

// --- LÓGICA DE GEOLOCALIZACIÓN DIRECTA (SISTEMA OPERATIVO) ---

function obtenerUbicacionNativa() {
    const btn = document.getElementById('btnGPS');
    
    if (!navigator.geolocation) {
        alert("Tu navegador no admite geolocalización.");
        return;
    }

    btn.innerText = '⏳ Leyendo satélites...';
    btn.disabled = true;

    const opcionesGPS = {
        enableHighAccuracy: true, // Solicita máxima precisión (GNSS/GPS)
        timeout: 15000,            // 15 segundos máximo
        maximumAge: 3000           // Acepta datos del sensor de hasta 3 segundos atrás
    };

    // Uso directo de la API del navegador
    navigator.geolocation.getCurrentPosition(
        exitoUbicacion,
        errorUbicacion,
        opcionesGPS
    );
}

function exitoUbicacion(posicion) {
    restablecerBoton();

    const lat = posicion.coords.latitude;
    const lng = posicion.coords.longitude;
    const precisionMetros = posicion.coords.accuracy;

    const latLng = [lat, lng];
    const puntoUsuario = turf.point([lng, lat]);

    let reporteMetadata = `<b>📍 Posición GPS Exacta:</b><br>`;
    reporteMetadata += `<b>Lat:</b> ${lat.toFixed(6)}, <b>Lng:</b> ${lng.toFixed(6)}<br>`;
    reporteMetadata += `<small><b>Precisión:</b> ~${Math.round(precisionMetros)} metros</small><hr>`;

    let halladoEnAlgunaCapa = false;

    // Consulta espacial con Turf.js
    capasCargadas.forEach(item => {
        item.geojson.features.forEach(feature => {
            if (turf.booleanPointInPolygon(puntoUsuario, feature)) {
                halladoEnAlgunaCapa = true;
                reporteMetadata += `<b>Capa: ${item.nombre}</b><br>`;
                for (let propiedad in feature.properties) {
                    reporteMetadata += `• <b>${propiedad}:</b> ${feature.properties[propiedad]}<br>`;
                }
                reporteMetadata += `<br>`;
            }
        });
    });

    if (!halladoEnAlgunaCapa) {
        reporteMetadata += `<i>No te encuentras dentro de ningún polígono de las capas cargadas.</i>`;
    }

    // Limpieza de marcadores anteriores
    if (puntoRojoUbicacion) map.removeLayer(puntoRojoUbicacion);
    if (circuloPrecision) map.removeLayer(circuloPrecision);

    // Círculo del margen de error
    circuloPrecision = L.circle(latLng, {
        radius: precisionMetros,
        color: '#ff0000',
        fillColor: '#ff0000',
        fillOpacity: 0.15,
        stroke: false
    }).addTo(map);

    // Punto rojo de ubicación
    puntoRojoUbicacion = L.circleMarker(latLng, {
        radius: 9,
        color: '#ffffff',
        weight: 3,
        fillColor: '#ff0000',
        fillOpacity: 1.0
    })
    .addTo(map)
    .bindPopup(reporteMetadata);

    // Encuadre y Zoom a nivel de calle (Zoom 18)
    map.flyTo(latLng, 18, { animate: true, duration: 1.5 });
    
    setTimeout(() => {
        puntoRojoUbicacion.openPopup();
    }, 1200);
}

function errorUbicacion(error) {
    restablecerBoton();
    let detalle = "";
    switch(error.code) {
        case error.PERMISSION_DENIED:
            detalle = "El navegador tiene bloqueado el permiso de ubicación.";
            break;
        case error.POSITION_UNAVAILABLE:
            detalle = "La posición GPS no está disponible en este momento.";
            break;
        case error.TIMEOUT:
            detalle = "El sensor GPS tardó demasiado en responder.";
            break;
        default:
            detalle = error.message;
    }
    alert("Atención: " + detalle);
}

function restablecerBoton() {
    const btn = document.getElementById('btnGPS');
    btn.innerText = '📍 Obtener Ubicación Exacta';
    btn.disabled = false;
}
</script>
</body>
</html>
