<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapas_DGA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map');

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}).addTo(map);

const controlCapas = L.control.layers({}, {}, { collapsed: false }).addTo(map);
const grupoGeneral = L.featureGroup();

function crearPopup(feature) {
    let html = '';
    for (let campo in feature.properties) {
        html += '<b>' + campo + '</b>: ' + feature.properties[campo] + '<br>';
    }
    return html;
}

function crearCapa(url, color, nombre, mostrarEtiqueta = false) {
    return fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error(`No se pudo cargar "${url}" (Estado: ${response.status})`);
            }
            return response.json();
        })
        .then(data => {
            const capa = L.geoJSON(data, {
                style: {
                    color: color,
                    weight: 2,
                    fillOpacity: 0.5
                },
                onEachFeature: function (feature, layer) {
                    layer.bindPopup(crearPopup(feature));
                    if (mostrarEtiqueta && feature.properties && feature.properties.NOM_SSUBC) {
                        layer.bindTooltip(
                            feature.properties.NOM_SSUBC,
                            { permanent: true, direction: 'center' }
                        );
                    }
                }
            });

            controlCapas.addOverlay(capa, nombre);
            capa.addTo(map);
            grupoGeneral.addLayer(capa);
            return capa;
        });
}

// Carga de capas
Promise.all([
    crearCapa('./SubRM2.geojson', 'red', 'Subsubcuencas', true),
    crearCapa('./Juntas.geojson', 'blue', 'Juntas de Vigilancia'),
    crearCapa('./Restriccion.geojson', 'green', 'Restricciones') // Verifica la ortografía exacta en GitHub
])
.then(() => {
    if (grupoGeneral.getLayers().length > 0) {
        map.fitBounds(grupoGeneral.getBounds());
    }
})
.catch(error => {
    alert(error.message);
    console.error('Detalle del error:', error);
});
</script>
</body>
</html>
