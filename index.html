<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mapa Hidrológico</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
00%;
    margin: 0;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leafletscript>

var map = L.map('map').setView([-33,-70],6);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19
}
).addTo(map);

fetch('./Subcuencas Json.geojson')
.then(function(response){
    return response.json();
})
.then(function(data){

    var capa = L.geoJSON(data).addTo(map);

    map.fitBounds(capa.getBounds());

})
.catch(function(error){

    console.log(error);

});

</script>

</body>
</html>
